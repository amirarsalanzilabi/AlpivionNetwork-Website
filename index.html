<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Alpivion Network</title>
    <meta name="description" content="Join Alpivion Network, the premier flight simulation community for virtual pilots. Participate in group flights, connect with fellow aviators, and share your passion for aviation." />
    <meta name="author" content="Alpivion Network" />
    <meta name="keywords" content="flight simulation, virtual pilot, group flights, MSFS, X-Plane, flight sim community, aviation" />
    <link rel="canonical" href="https://alpivionnetwork.com" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Alpivion Network" />
    <meta property="og:title" content="Alpivion Network - Flight Simulation Community" />
    <meta property="og:description" content="Join Alpivion Network, the premier flight simulation community for virtual pilots. Participate in group flights, connect with fellow aviators, and share your passion for aviation." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alpivionnetwork.com" />
    <meta property="og:image" content="https://alpivionnetwork.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alpivion Network - Flight Simulation Community" />
    <meta name="twitter:description" content="Join Alpivion Network, the premier flight simulation community for virtual pilots. Participate in group flights and connect with fellow aviators." />
    <meta name="twitter:image" content="https://alpivionnetwork.com/og-image.png" />

    <!-- Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Alpivion Network",
      "url": "https://alpivionnetwork.com",
      "description": "The premier flight simulation community for virtual pilots",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://alpivionnetwork.com/forums?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Alpivion Network",
      "url": "https://alpivionnetwork.com",
      "logo": "https://alpivionnetwork.com/apple-touch-icon.png",
      "sameAs": [
        "https://discord.gg/fz3Ebn4NfJ"
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
